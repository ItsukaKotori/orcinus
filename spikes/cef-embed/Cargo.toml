[package]
name = "cef-embed"
version = "0.1.0"
edition = "2021"
publish = false
description = "ade Phase 0 spike: minimal CEF host window (size/build-time/startup/memory measurements)"

[package.metadata.cef.bundle]
helper_name = "cef_embed_helper"

[dependencies]
cef = { version = "=152.2.0", default-features = false, features = ["build-util"] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
] }
