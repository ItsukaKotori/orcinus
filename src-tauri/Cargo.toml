[package]
name = "orcinus-app"
version = "0.0.1"
edition = "2021"

[workspace]
members = ["crates/*"]

[lib]
name = "orcinus_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
