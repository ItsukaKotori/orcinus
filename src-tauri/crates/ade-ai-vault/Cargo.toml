[package]
name = "ade-ai-vault"
version = "0.0.1"
edition = "2021"

[dependencies]
ade-core = { path = "../ade-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
