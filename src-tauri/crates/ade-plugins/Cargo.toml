[package]
name = "ade-plugins"
version = "0.0.1"
edition = "2021"

[dependencies]
hex = "0.4"
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
