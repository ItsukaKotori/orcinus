[package]
name = "ade-core"
version = "0.0.1"
edition = "2021"

[features]
# Enables `specta::Type` derives on the IPC payload types so `ade-bridge` can
# export TypeScript bindings without leaking the dependency into the core crate.
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
