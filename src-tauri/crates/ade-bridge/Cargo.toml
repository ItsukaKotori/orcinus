[package]
name = "ade-bridge"
version = "0.0.1"
edition = "2021"

[dependencies]
ade-core = { path = "../ade-core", features = ["specta"] }
ade-fs = { path = "../ade-fs", features = ["specta"] }
ade-git = { path = "../ade-git", features = ["specta"] }
ade-hooks = { path = "../ade-hooks" }
ade-pty = { path = "../ade-pty" }
ade-store = { path = "../ade-store" }
base64 = "0.22"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
