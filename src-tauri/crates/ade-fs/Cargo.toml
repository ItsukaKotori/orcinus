[package]
name = "ade-fs"
version = "0.0.1"
edition = "2021"

[features]
# Enables `specta::Type` derives on the IPC payload types so `ade-bridge` can
# export TypeScript bindings without leaking the dependency into the fs crate.
specta = ["dep:specta"]

[dependencies]
ade-core = { path = "../ade-core" }
base64 = "0.22"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror = "2"
trash = "5"

[dev-dependencies]
globset = "0.4"
serde_json = "1"
