[package]
name = "ade-fs"
version = "0.0.1"
edition = "2021"

[dependencies]
ade-core = { path = "../ade-core" }
base64 = "0.22"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
trash = "5"

[dev-dependencies]
serde_json = "1"
