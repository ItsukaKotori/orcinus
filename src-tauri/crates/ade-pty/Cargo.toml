[package]
name = "ade-pty"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
