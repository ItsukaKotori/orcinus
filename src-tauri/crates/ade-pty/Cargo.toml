[package]
name = "ade-pty"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
futures-util = "0.3.34"
portable-pty = "0.9.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.26.1", features = ["v4"] }
